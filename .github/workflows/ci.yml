name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type check
        run: pnpm typecheck

  schema-drift:
    name: Schema Drift Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate migrations from schema
        run: pnpm db:generate
        env:
          POSTGRES_URL: "postgresql://user:pass@localhost:5432/db"

      - name: Verify no uncommitted migration changes
        run: |
          if ! git diff --exit-code drizzle/; then
            echo ""
            echo "::error::schema.ts and drizzle/ are out of sync."
            echo "::error::Run 'pnpm db:generate' locally and commit the resulting drizzle/*.sql + drizzle/meta/* files."
            echo "::error::See .claude/rules/database.md 'Schema-Migration Drift' for context."
            exit 1
          fi

  dashboard-tokens:
    name: Dashboard Token Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Check dashboard palette tokens
        run: node scripts/verify-dashboard-tokens.mjs

  rtl-guard:
    name: RTL Logical-Property Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Check dashboard RTL logical properties
        run: node scripts/verify-rtl.mjs

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, schema-drift]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build:ci
        env:
          # Provide minimal env vars for build (no actual secrets needed for build check)
          POSTGRES_URL: "postgresql://user:pass@localhost:5432/db"
          BETTER_AUTH_SECRET: "build-check-secret-32-characters!"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          OPENROUTER_API_KEY: "ci-build-placeholder"
          OPENROUTER_MODEL: "ci-build-placeholder"
          TOKEN_ENCRYPTION_KEYS: "ci-build-placeholder-32-chars!!"
          REPLICATE_MODEL_FAST: "ci-build-placeholder"
          REPLICATE_MODEL_PRO: "ci-build-placeholder"
          REPLICATE_MODEL_FALLBACK: "ci-build-placeholder"
          REPLICATE_MODEL_ADVANCED: "ci-build-placeholder"
